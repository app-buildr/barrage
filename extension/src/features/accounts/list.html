<p class="hint panel-hint">
  L'interrupteur <strong>Blocage automatique</strong> est actif par défaut. Désactivez-le pour que Barrage
  ignore un compte, et le débloque s'il l'avait bloqué.
</p>
<aside class="tip" data-part="tip" hidden>
  <svg class="tip-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v5.5M12 7.5v.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  <p>Les comptes que vous avez déjà bloqués sur X seront synchronisés avec Barrage.</p>
  <button type="button" class="tip-close" data-part="tip-close" aria-label="Fermer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
</aside>

<div class="alert" data-part="alert" role="alert" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v5.5M12 16.5v.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  <div class="alert-body">
    <strong data-part="title"></strong>
    <span data-part="message"></span>
  </div>
  <a href="https://x.com/home" target="_blank" rel="noopener">Ouvrir x.com</a>
</div>

<div class="card progress" data-part="progress">
  <div class="progress-head">
    <span class="progress-count" data-part="blocked"></span>
    <span class="progress-total" data-part="total"></span>
    <span class="progress-account" data-part="account"></span>
  </div>
  <div class="progress-bar" data-part="bar" role="img"><span class="progress-fill" data-part="fill"></span></div>
</div>

<input type="search" class="search" data-part="search" spellcheck="false" autocomplete="off"
  placeholder="Rechercher un compte…">

<div class="chips" data-part="chips" role="group" aria-label="Filtrer par état"></div>

<div class="card table-wrap">
  <table>
    <thead>
      <tr>
        <th class="toggle-cell"><abbr title="Blocage automatique">Blocage auto</abbr></th>
        <th>Compte</th>
        <th>État</th>
        <th class="action"><span class="sr-only">Action</span></th>
      </tr>
    </thead>
    <tbody data-part="rows"></tbody>
  </table>
  <p class="no-match" data-part="no-match" hidden></p>
</div>
