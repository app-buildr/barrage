name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
        with:
          # check-repo.mjs compare lists/ à origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Non bloquant tant que tests/ a des erreurs de type (TEST-07).
      - run: npm run typecheck:tests
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - run: npm run check
